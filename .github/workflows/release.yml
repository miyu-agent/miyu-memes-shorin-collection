# 发包：推 `v*` 标签（v 加上 package.toml 里的 version）时先查索引和图对得上，再照官方打包模板把仓库根目录打成
# `memes-shorin-collection-<版本>.miyu`，传进这个标签的 Release；官方软件源每天收一次，收进去以后
# `miyu pkg install memes-shorin-collection` 就能装（2026-11-13 项目主人定进官方软件源，以前是 tar.gz、解开手动装）。
#
# 手动跑（workflow_dispatch）只查、只打包，包放进这一次跑的产物，不建 Release。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # 结构不对就不发：清单、索引都要在，索引里的每张图都要有。
  check:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: 索引里的图都在
        run: |
          for need in package.toml memes/index.json; do
            [ -f "$need" ] || { echo "::error::少了 $need"; exit 1; }
          done
          missing=$(python3 -c "import json,os,sys;d=sys.argv[1];print('\n'.join(m['file'] for m in json.load(open(d+'/index.json',encoding='utf-8'))['memes'] if not os.path.isfile(d+'/'+m['file'])))" memes)
          [ -z "$missing" ] || { echo "::error::索引里有、文件夹里没有：$missing"; exit 1; }

  pack:
    needs: check
    uses: miyu-agent/packages/.github/workflows/pack.yml@main
    permissions:
      contents: write
    with:
      package: memes-shorin-collection
